{% extends "base.html" %}

{% block content %}

<h2>Register</h2>

<form method="POST" action="{{ url_for('register') }}">

    <label>Name</label>

    <input
        type="text"
        name="name"
        required
    >

    <label>Email</label>

    <input
        type="email"
        name="email"
        required
    >

    <label>Password</label>

    <input
        type="password"
        name="password"
        required
    >

    <button type="submit" class="btn">
        Register
    </button>

</form>

<p>
    Already have an account?
    <a href="{{ url_for('login') }}">Login</a>
</p>

{% endblock %}
