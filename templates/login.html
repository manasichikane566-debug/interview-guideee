{% extends "base.html" %}

{% block content %}

<h2>Login</h2>

<form method="POST" action="{{ url_for('login') }}">

    <label>Email</label>

    <input
        type="email"
        name="email"
        required
    >

    <label>Password</label>

    <input
        type="password"
        name="password"
        required
    >

    <button type="submit" class="btn">
        Login
    </button>

</form>

<p>
    Don't have an account?
    <a href="{{ url_for('register') }}">Register</a>
</p>

{% endblock %}
