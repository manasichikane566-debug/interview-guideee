{% extends "base.html" %}

{% block content %}

<h2>Interview Questions</h2>

<p>Practice these common technical interview questions.</p>

{% for q in questions %}

<div class="question-card">

    <h3>
        {{ loop.index }}. {{ q.question }}
    </h3>

    <p>
        <strong>Answer:</strong>
        {{ q.answer }}
    </p>

</div>

{% endfor %}

{% endblock %}
