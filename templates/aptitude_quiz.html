{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="page-title">
        <h1>🎯 Aptitude Practice Quiz</h1>
        <p>Test your quantitative and logical reasoning skills.</p>
    </div>

    <form method="POST">

        {% for question in questions %}

        <div class="quiz-card">

            <h3>
                Question {{ loop.index }}
            </h3>

            <p style="font-size: 18px; font-weight: 600; margin-bottom: 18px;">
                {{ question.question }}
            </p>

            {% for option in question.options %}

            <label class="option">

                <input
                    type="radio"
                    name="q{{ loop.parent.index0 }}"
                    value="{{ option }}"
                    required
                >

                {{ option }}

            </label>

            {% endfor %}

        </div>

        {% endfor %}

        <div style="text-align: center; margin: 35px 0;">

            <button type="submit" class="btn btn-primary">
                🚀 Submit Quiz
            </button>

        </div>

    </form>

</div>

{% endblock %}
